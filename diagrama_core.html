<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');
    body {
      margin: 0; padding: 40px; background: #f5f5f5;
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
  </style>
</head>
<body>
  <svg width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="core-title core-desc">
    <title id="core-title">Flujo Core del Framework</title>
    <desc id="core-desc">Diagrama arquitectónico del flujo principal: desde la descarga y onboarding, hasta la ejecución del orquestador.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
      </marker>
    </defs>
    
    <rect width="100%" height="100%" fill="#f5f5f5"/>
    <text x="40" y="40" fill="#2d3142" font-size="28" font-family="'Instrument Serif', serif">1. Arquitectura Core del Framework</text>
    <text x="40" y="60" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Visión macro del sistema (Identificación de huecos estructurales)</text>

    <!-- ARROWS -->
    <!-- User to Orquestador -->
    <line x1="160" y1="232" x2="440" y2="232" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="250" y="220" width="100" height="12" rx="2" fill="#f5f5f5"/>
    <text x="300" y="229" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">"QUIERO ESTUDIAR"</text>

    <!-- User to Onboarding -->
    <path d="M 160 232 L 180 232 A 8 8 0 0 0 188 224 L 188 120 A 8 8 0 0 1 196 112 L 240 112" fill="none" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrow-accent)"/>
    <rect x="160" y="140" width="60" height="12" rx="2" fill="#f5f5f5"/>
    <text x="190" y="149" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SIN PERFIL</text>

    <!-- Onboarding to Perfil -->
    <line x1="360" y1="112" x2="440" y2="112" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="375" y="100" width="50" height="12" rx="2" fill="#f5f5f5"/>
    <text x="400" y="109" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">GENERA</text>

    <!-- Perfil to Orquestador -->
    <line x1="500" y1="144" x2="500" y2="200" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="470" y="166" width="60" height="12" rx="2" fill="#f5f5f5"/>
    <text x="500" y="175" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">INYECTA</text>

    <!-- AGENTS to Orquestador -->
    <line x1="500" y1="320" x2="500" y2="264" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/>
    <rect x="470" y="286" width="60" height="12" rx="2" fill="#f5f5f5"/>
    <text x="500" y="295" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CONTROLA</text>

    <!-- Orquestador to Skills -->
    <line x1="560" y1="232" x2="640" y2="232" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="575" y="220" width="50" height="12" rx="2" fill="#f5f5f5"/>
    <text x="600" y="229" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">DELEGA</text>

    <!-- Skills to Expediente -->
    <line x1="760" y1="232" x2="840" y2="232" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="770" y="220" width="60" height="12" rx="2" fill="#f5f5f5"/>
    <text x="800" y="229" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">RESULTADO</text>


    <!-- NODES -->
    <!-- N1: User -->
    <rect x="40" y="200" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="48" y="206" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="68" y="215" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">USER</text>
    <text x="100" y="234" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Estudiante</text>
    <text x="100" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Clona el repo</text>

    <!-- N2: Onboarding -->
    <rect x="240" y="80" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="248" y="86" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="268" y="95" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">SKILL</text>
    <text x="300" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">onboarding-perfil</text>
    <text x="300" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UI Cuestionario</text>

    <!-- N3: Perfil -->
    <rect x="440" y="80" width="120" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <rect x="448" y="86" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="468" y="95" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">CONFIG</text>
    <text x="500" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PERFIL.md</text>
    <text x="500" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Lenguaje y Dominio</text>

    <!-- N4: Orquestador -->
    <rect x="440" y="200" width="120" height="64" rx="6" fill="rgba(235,108,54,0.05)" stroke="#eb6c36" stroke-width="1"/>
    <rect x="448" y="206" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.4)" stroke-width="0.8"/>
    <text x="468" y="215" fill="rgba(235,108,54,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">CORE</text>
    <text x="500" y="234" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">orquestador</text>
    <text x="500" y="250" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Cerebro central</text>

    <!-- N5: AGENTS -->
    <rect x="440" y="320" width="120" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <rect x="448" y="326" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="468" y="335" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">REGLAS</text>
    <text x="500" y="354" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AGENTS.md</text>
    <text x="500" y="370" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Método Socrático</text>

    <!-- N6: Skills Subsystem -->
    <rect x="640" y="200" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="648" y="206" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="668" y="215" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">SUBSYS</text>
    <text x="700" y="234" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Capa de Skills</text>
    <text x="700" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Ver Diagrama 2</text>

    <!-- N7: Expediente -->
    <rect x="840" y="200" width="120" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <rect x="848" y="206" width="50" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="873" y="215" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">ARTIFACT</text>
    <text x="900" y="234" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">expediente.md</text>
    <text x="900" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Progreso guardado</text>

  </svg>
</body>
</html>
