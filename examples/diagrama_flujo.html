<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');
    body {
      margin: 0; padding: 40px; background: #f5f5f5;
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    .diagram-container {
      background: #f5f5f5;
      padding: 0;
    }
  </style>
</head>
<body>
<div class="diagram-container">
  <svg width="680" height="460" viewBox="0 0 680 460" role="img" aria-labelledby="arq-title arq-desc">
    <title id="arq-title">Arquitectura del Tutor Agentic</title>
    <desc id="arq-desc">Diagrama que muestra cómo el estudiante configura el perfil y cómo el orquestador deriva a skills contextuales o genéricas.</desc>

    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
      </marker>
      <!-- Dot pattern -->
      <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
      </pattern>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#f5f5f5"/>
    <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

    <!-- Title -->
    <text x="40" y="40" fill="#2d3142" font-size="28" font-family="'Instrument Serif', serif">Flujo del Framework Agentic</text>
    <text x="40" y="60" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Arquitectura modular de estudio</text>

    <!-- ARROWS -->
    
    <!-- User to Config (Horizontal) -->
    <line x1="160" y1="132" x2="272" y2="132" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="180" y="120" width="72" height="12" rx="2" fill="#f5f5f5"/>
    <text x="216" y="129" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONFIGURA</text>

    <!-- Config to Orchestrator (Vertical) -->
    <line x1="340" y1="164" x2="340" y2="232" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/>
    <rect x="304" y="184" width="72" height="12" rx="2" fill="#f5f5f5"/>
    <text x="340" y="193" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INICIALIZA</text>

    <!-- Orchestrator to Context Skills -->
    <path d="M 312 304 L 312 328 A 8 8 0 0 1 304 336 L 168 336 A 8 8 0 0 0 160 344 L 160 366" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="180" y="330" width="60" height="12" rx="2" fill="#f5f5f5"/>
    <text x="210" y="339" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INVOCA</text>

    <!-- Orchestrator to Generic Skills -->
    <path d="M 368 304 L 368 328 A 8 8 0 0 0 376 336 L 512 336 A 8 8 0 0 1 520 344 L 520 366" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="440" y="330" width="60" height="12" rx="2" fill="#f5f5f5"/>
    <text x="470" y="339" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INVOCA</text>

    <!-- NODES -->

    <!-- Node 1: User -->
    <rect x="40" y="100" width="120" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="40" y="100" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <!-- Type Tag -->
    <rect x="48" y="106" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="68" y="115" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACTOR</text>
    <text x="100" y="134" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nuevo Estudiante</text>
    <text x="100" y="150" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Clona el repo</text>

    <!-- Node 2: Config (Focal) -->
    <rect x="280" y="100" width="120" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="280" y="100" width="120" height="64" rx="6" fill="rgba(235,108,54,0.05)" stroke="#eb6c36" stroke-width="1"/>
    <rect x="288" y="106" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.4)" stroke-width="0.8"/>
    <text x="308" y="115" fill="rgba(235,108,54,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILE</text>
    <text x="340" y="134" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PERFIL.md</text>
    <text x="340" y="150" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Define Dominio</text>

    <!-- Node 3: Orchestrator -->
    <rect x="280" y="240" width="120" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="280" y="240" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="288" y="246" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="308" y="255" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
    <text x="340" y="274" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Orquestador</text>
    <text x="340" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Recibe Prompts</text>

    <!-- Node 4: Contextual Skills -->
    <rect x="100" y="372" width="120" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="100" y="372" width="120" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <rect x="108" y="378" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="132" y="387" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SKILLS</text>
    <text x="160" y="406" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Contextuales</text>
    <text x="160" y="422" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Leen el Perfil</text>

    <!-- Node 5: Generic Skills -->
    <rect x="460" y="372" width="120" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="460" y="372" width="120" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <rect x="468" y="378" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="492" y="387" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SKILLS</text>
    <text x="520" y="406" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Genéricas</text>
    <text x="520" y="422" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Universales</text>

    <!-- Legend -->
    <line x1="40" y1="440" x2="640" y2="440" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="40" y="454" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA:</text>
    <rect x="110" y="448" width="8" height="8" rx="2" fill="#eb6c36"/>
    <text x="124" y="454" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Punto Crítico (Configuración)</text>
    <rect x="300" y="448" width="8" height="8" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="314" y="454" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Ejecución Core</text>

  </svg>
</div>
</body>
</html>
