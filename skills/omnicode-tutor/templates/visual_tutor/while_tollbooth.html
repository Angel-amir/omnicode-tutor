<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .execution-ball { transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .dim-path { stroke: #334155; stroke-width: 4; transition: all 0.5s; stroke-dasharray: 8 8; }
    .glow-path { stroke: #06b6d4; stroke-width: 6; filter: drop-shadow(0 0 5px #06b6d4); transition: all 0.5s; stroke-dasharray: none; }
    
    .gate-closed { transform: rotate(0deg); border-color: #f43f5e; box-shadow: 0 0 15px rgba(244,63,94,0.4); }
    .gate-open { transform: rotate(-90deg); border-color: #10b981; box-shadow: 0 0 15px rgba(16,185,129,0.4); }
    .gate-bar { transition: transform 0.5s ease; transform-origin: left center; }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-2">
  <div class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-xl p-4 shadow-sm flex flex-col gap-4 relative">
    
    <div class="flex justify-between items-end">
      <div>
        <h2 class="font-semibold text-lg flex items-center gap-2">🚧 The While Loop: Toll Booth</h2>
        <p class="text-[var(--muted-foreground)] text-sm">Visualizing conditions, arena execution, and U-turns.</p>
      </div>
      <div class="flex gap-2">
        <button id="btn-prev" disabled class="px-3 py-1 bg-[var(--background)] border border-[var(--border)] rounded-md text-sm transition-colors">Prev</button>
        <button id="btn-next" class="px-3 py-1 bg-cyan-500 text-white rounded-md text-sm hover:bg-cyan-600 transition-colors">Next</button>
      </div>
    </div>

    <div class="flex flex-row gap-4 h-[450px]">
      
      <!-- Code Panel -->
      <div class="w-1/3 flex flex-col gap-2 relative">
        <h3 class="text-xs font-bold text-[var(--muted-foreground)] uppercase tracking-wider">Python Code</h3>
        <div id="code-block" class="bg-[var(--background)] rounded-md border border-[var(--border)] py-2 font-mono text-xs overflow-x-auto flex-grow">
          <div class="px-2 py-1 transition-colors border-l-4 border-transparent" id="code-1">1  count = 1</div>
          <div class="px-2 py-1 transition-colors border-l-4 border-transparent" id="code-2">2  while count < 3:</div>
          <div class="px-2 py-1 transition-colors border-l-4 border-transparent pl-6" id="code-3">3      print(count)</div>
          <div class="px-2 py-1 transition-colors border-l-4 border-transparent pl-6" id="code-4">4      count += 1</div>
          <div class="px-2 py-1 transition-colors border-l-4 border-transparent" id="code-5">5  print("Done")</div>
        </div>

        <!-- Global State Panel -->
        <div class="absolute bottom-4 left-4 right-4 bg-slate-800 border-2 border-slate-600 rounded-lg p-3 shadow-lg">
           <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-2">Variables in Memory</span>
           <div class="flex items-center gap-3">
              <span class="font-mono text-sky-300 font-bold">count =</span>
              <div id="var-count" class="w-10 h-10 bg-slate-700 rounded border border-slate-500 flex items-center justify-center font-mono font-bold text-lg text-white transition-all duration-300">?</div>
           </div>
        </div>
      </div>

      <!-- Logic Map Panel -->
      <div class="w-2/3 bg-slate-900 rounded-lg border-4 border-slate-800 shadow-inner relative overflow-hidden" id="map-container">
        
        <!-- Background Paths -->
        <svg class="absolute inset-0 w-full h-full pointer-events-none z-0">
          <!-- Entry to Toll Booth -->
          <path id="path-entry" d="M 150 20 L 150 80" class="dim-path" fill="none"/>
          <!-- Arena Entry (True) -->
          <path id="path-true" d="M 150 160 L 150 210" class="dim-path" fill="none"/>
          <!-- Inside Arena -->
          <path id="path-arena" d="M 150 250 L 150 300" class="dim-path" fill="none"/>
          <!-- The U-Turn (Back to Toll Booth) -->
          <path id="path-uturn" d="M 150 340 L 150 380 Q 150 420 100 420 L 50 420 Q 20 420 20 380 L 20 120 Q 20 80 50 80 L 110 80" class="dim-path" fill="none" stroke-linecap="round"/>
          <!-- Bypass Exit (False) -->
          <path id="path-false" d="M 190 120 L 320 120 Q 360 120 360 160 L 360 380" class="dim-path" fill="none"/>
        </svg>

        <!-- Initial Assignment Dock -->
        <div id="dock-start" class="absolute top-[20px] left-[150px] -translate-x-1/2 -translate-y-1/2 w-8 h-8 rounded-full"></div>

        <!-- THE TOLL BOOTH (Condition) -->
        <div class="absolute top-[80px] left-[150px] -translate-x-1/2 w-[220px] bg-slate-800 border-2 border-slate-500 rounded-lg shadow-lg z-10 flex flex-col p-2">
           <span class="text-[9px] uppercase font-bold text-yellow-500 text-center mb-1">Toll Booth (Condition)</span>
           <div class="bg-slate-900 rounded p-1 flex justify-center items-center gap-2">
             <span class="font-mono text-slate-300 text-sm">count < 3</span>
           </div>
           
           <!-- The Gate Mechanism -->
           <div class="relative mt-4 h-[30px] flex items-center justify-center">
             <!-- Gate Pole -->
             <div class="absolute left-6 w-4 h-4 bg-slate-600 rounded-full z-20"></div>
             <!-- Gate Bar -->
             <div id="gate-bar" class="gate-bar absolute left-[30px] w-[140px] h-2 bg-rose-500 rounded-r gate-closed z-20"></div>
             <!-- Dock for condition checking -->
             <div id="dock-check" class="w-10 h-10 border-2 border-dashed border-yellow-500/50 rounded-full flex-shrink-0 absolute top-[-10px] left-[50%] -translate-x-1/2"></div>
           </div>
        </div>

        <!-- THE ARENA (Loop Body) -->
        <div class="absolute top-[210px] left-[150px] -translate-x-1/2 w-[200px] h-[130px] border-2 border-emerald-500/40 bg-emerald-900/20 rounded-xl z-10 flex flex-col items-center justify-around py-2">
           <span class="absolute -top-3 bg-slate-900 px-2 text-[10px] uppercase font-bold text-emerald-400">Loop Arena</span>
           
           <!-- Action 1: Print -->
           <div class="w-[140px] bg-slate-800 border border-slate-600 rounded flex items-center justify-center py-1">
             <div id="dock-print" class="w-8 h-8 rounded-full border-2 border-dashed border-slate-500 absolute left-8"></div>
             <span class="font-mono text-sky-300 text-xs">print(count)</span>
           </div>

           <!-- Action 2: Increment -->
           <div id="box-increment" class="w-[140px] bg-slate-800 border border-amber-500 rounded flex items-center justify-center py-1 transition-all duration-300">
             <div id="dock-inc" class="w-8 h-8 rounded-full border-2 border-dashed border-amber-500/50 absolute left-8"></div>
             <span class="font-mono text-amber-400 text-xs font-bold">count += 1</span>
           </div>
        </div>

        <!-- The Exit (Done) -->
        <div class="absolute top-[380px] left-[360px] -translate-x-1/2 w-[120px] bg-slate-800 border-2 border-purple-500 rounded-lg shadow-lg z-10 flex items-center justify-center py-2">
           <div id="dock-end" class="w-8 h-8 rounded-full border-2 border-dashed border-purple-500/50 absolute -top-4"></div>
           <span class="font-mono text-purple-300 text-sm">print("Done")</span>
        </div>

        <!-- The Execution Ball -->
        <div id="exec-ball" class="execution-ball absolute w-10 h-10 border-[3px] border-white rounded-full z-40 flex items-center justify-center text-white font-black font-mono text-sm scale-0 opacity-0 shadow-[0_0_15px_rgba(255,255,255,0.5)]" style="top: 0px; left: 0px;">
        </div>

      </div>
    </div>

    <!-- Explanation -->
    <div class="bg-indigo-500/10 border-l-4 border-indigo-500 p-3 rounded-r-md mt-2 h-[60px] flex items-center">
      <p class="text-sm" id="explanation-display">Loading...</p>
    </div>

  </div>

<script>
const steps = [
  { c: 1, e: "Paso 1: Iniciamos asignando 'count = 1' en la memoria global.", ball: { s: 1, d: "dock-start", bg: "bg-cyan-500" }, val: 1, gate: 0, p: ["path-entry"] },
  
  // ITERATION 1
  { c: 2, e: "Llegamos al Torniquete (while). Lee la memoria: ¿1 < 3? VERDADERO.", ball: { s: 1, d: "dock-check", bg: "bg-yellow-500" }, val: 1, gate: 0, p: ["path-entry"] },
  { c: 2, e: "¡La barrera se abre! La bolita entra a la Arena del Bucle.", ball: { s: 1, d: "dock-check", bg: "bg-emerald-500" }, val: 1, gate: 1, p: ["path-true"] },
  { c: 3, e: "Arena - Tarea 1: Imprimimos el valor actual (1).", ball: { s: 1, d: "dock-print", bg: "bg-sky-500" }, val: 1, gate: 1, p: ["path-true"] },
  { c: 4, e: "Arena - Tarea 2: CRÍTICO. Actualizamos el contador. De 1 pasa a 2.", ball: { s: 1, d: "dock-inc", bg: "bg-amber-500" }, val: 2, gate: 1, incPulse: 1, p: ["path-arena"] },
  { c: 2, e: "¡El U-Turn! El bloque terminó, así que somos eyectados físicamente de regreso al Torniquete.", ball: { s: 1, d: "dock-check", bg: "bg-yellow-500" }, val: 2, gate: 0, p: ["path-uturn"] },
  
  // ITERATION 2
  { c: 2, e: "El Torniquete vuelve a evaluar: ¿2 < 3? VERDADERO.", ball: { s: 1, d: "dock-check", bg: "bg-yellow-500" }, val: 2, gate: 0, p: ["path-uturn"] },
  { c: 2, e: "La barrera se abre de nuevo.", ball: { s: 1, d: "dock-check", bg: "bg-emerald-500" }, val: 2, gate: 1, p: ["path-true"] },
  { c: 3, e: "Imprimimos el valor (2).", ball: { s: 1, d: "dock-print", bg: "bg-sky-500" }, val: 2, gate: 1, p: ["path-true"] },
  { c: 4, e: "Actualizamos el contador. De 2 pasa a 3.", ball: { s: 1, d: "dock-inc", bg: "bg-amber-500" }, val: 3, gate: 1, incPulse: 1, p: ["path-arena"] },
  { c: 2, e: "¡El U-Turn! Somos forzados a regresar al Torniquete por tercera vez.", ball: { s: 1, d: "dock-check", bg: "bg-yellow-500" }, val: 3, gate: 0, p: ["path-uturn"] },

  // ITERATION 3 (Fails)
  { c: 2, e: "El Torniquete evalúa: ¿3 < 3? ¡FALSO! Ya no se cumple.", ball: { s: 1, d: "dock-check", bg: "bg-rose-500" }, val: 3, gate: 0, p: ["path-uturn"] },
  { c: 5, e: "Como es falso, el acceso a la arena es denegado. Somos desviados al carril de salida (Exit) y el bucle termina.", ball: { s: 1, d: "dock-end", bg: "bg-purple-500" }, val: 3, gate: 0, p: ["path-false"] },
];

let current = 0;

function centerBall(dockId) {
  const container = document.getElementById('map-container');
  const dockEl = document.getElementById(dockId);
  if(!dockEl) return;
  const cr = container.getBoundingClientRect();
  const dr = dockEl.getBoundingClientRect();
  const ball = document.getElementById('exec-ball');
  
  const y = (dr.top - cr.top - container.clientTop) + (dr.height/2) - 20; // 20 is half ball width
  const x = (dr.left - cr.left - container.clientLeft) + (dr.width/2) - 20;
  
  ball.style.top = y + 'px';
  ball.style.left = x + 'px';
}

function update() {
  const step = steps[current];
  document.getElementById('explanation-display').innerText = step.e;
  
  // Code Highlighting
  [1,2,3,4,5].forEach(n => {
    const el = document.getElementById(`code-${n}`);
    el.classList.remove('bg-cyan-500/20', 'border-cyan-500', 'font-bold');
    if (el.innerHTML.includes('⬅️')) el.innerHTML = el.innerHTML.replace('<span class="float-right animate-pulse text-cyan-500">⬅️</span>', '');
  });
  if(step.c) {
    const act = document.getElementById(`code-${step.c}`);
    act.classList.add('bg-cyan-500/20', 'border-cyan-500', 'font-bold');
    act.innerHTML += '<span class="float-right animate-pulse text-cyan-500">⬅️</span>';
  }

  // Global Variable updates
  const varBox = document.getElementById('var-count');
  varBox.innerText = step.val;
  if(step.incPulse) {
    varBox.classList.add('bg-amber-600', 'border-amber-400', 'scale-110');
    document.getElementById('box-increment').classList.add('bg-amber-900/50', 'shadow-[0_0_15px_rgba(245,158,11,0.5)]');
  } else {
    varBox.classList.remove('bg-amber-600', 'border-amber-400', 'scale-110');
    document.getElementById('box-increment').classList.remove('bg-amber-900/50', 'shadow-[0_0_15px_rgba(245,158,11,0.5)]');
  }

  // Gate Animation
  const gate = document.getElementById('gate-bar');
  if(step.gate) {
    gate.classList.remove('gate-closed', 'bg-rose-500');
    gate.classList.add('gate-open', 'bg-emerald-500');
  } else {
    gate.classList.add('gate-closed', 'bg-rose-500');
    gate.classList.remove('gate-open', 'bg-emerald-500');
    // If it's the false check, make it pulse red harder
    if(step.ball.bg === 'bg-rose-500') {
       gate.style.boxShadow = '0 0 25px rgba(244,63,94,0.8)';
    } else {
       gate.style.boxShadow = '';
    }
  }

  // Path Highlights
  ['path-entry', 'path-true', 'path-arena', 'path-uturn', 'path-false'].forEach(p => {
    document.getElementById(p).classList.remove('glow-path');
    document.getElementById(p).classList.add('dim-path');
  });
  if(step.p) {
    step.p.forEach(p => {
      document.getElementById(p).classList.remove('dim-path');
      document.getElementById(p).classList.add('glow-path');
    });
  }

  // Ball Movement
  const ball = document.getElementById('exec-ball');
  if(step.ball.s) {
    centerBall(step.ball.d);
    // Reset colors
    ball.className = `execution-ball absolute w-10 h-10 border-[3px] border-white rounded-full z-40 flex items-center justify-center text-white font-black font-mono text-sm scale-100 opacity-100 shadow-[0_0_15px_rgba(255,255,255,0.5)] ${step.ball.bg}`;
  } else {
    ball.classList.replace('scale-100', 'scale-0');
    ball.classList.replace('opacity-100', 'opacity-0');
  }

  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === steps.length - 1;
}

document.getElementById('btn-next').onclick = () => { if(current<steps.length-1) { current++; update(); } };
document.getElementById('btn-prev').onclick = () => { if(current>0) { current--; update(); } };
window.addEventListener('resize', () => { if(steps[current].ball.s) centerBall(steps[current].ball.d); });

window.onload = () => { setTimeout(update, 100); };
</script>
</body>
</html>
