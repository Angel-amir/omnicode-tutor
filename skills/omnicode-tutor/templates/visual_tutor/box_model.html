<!DOCTYPE html>
<html>
<head>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    /* Ensure the SVG layer is absolutely positioned over the memory panels */
    #arrow-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-2">

  <div class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-xl p-4 shadow-sm flex flex-col gap-4 relative">
    
    <!-- Header -->
    <div class="flex justify-between items-end">
      <div>
        <h2 class="font-semibold text-lg flex items-center gap-2">📦 The Box Model: Memory & Pointers</h2>
        <p class="text-[var(--muted-foreground)] text-sm">Visualizing Stack vs Heap allocations.</p>
      </div>
      <div class="flex gap-2">
        <button id="btn-prev" disabled class="px-3 py-1 bg-[var(--background)] border border-[var(--border)] rounded-md text-sm hover:bg-[var(--muted)] disabled:opacity-50 disabled:cursor-not-allowed transition-colors">Prev</button>
        <button id="btn-next" class="px-3 py-1 bg-blue-500 text-white rounded-md text-sm hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">Next</button>
      </div>
    </div>

    <!-- Main Content Grid -->
    <div class="flex flex-row gap-4 relative min-h-[250px]">
      
      <!-- Code Panel -->
      <div class="w-1/3 flex flex-col gap-2">
        <h3 class="text-xs font-bold text-[var(--muted-foreground)] uppercase tracking-wider">Source Code</h3>
        <div id="code-block" class="bg-[var(--background)] rounded-md border border-[var(--border)] py-2 font-mono text-xs overflow-x-auto flex-grow">
          <!-- Code injected here -->
        </div>
      </div>

      <!-- RAM Panel (Stack & Heap) -->
      <div class="w-2/3 flex gap-4 relative" id="memory-container">
        <!-- SVG Layer for pointer arrows -->
        <svg id="arrow-svg"></svg>

        <!-- STACK -->
        <div class="w-1/2 flex flex-col gap-2">
          <h3 class="text-xs font-bold text-[var(--muted-foreground)] uppercase tracking-wider text-center">Stack (Variables)</h3>
          <div id="stack-boxes" class="bg-[var(--background)] border border-[var(--border)] rounded-md p-3 flex flex-col gap-3 min-h-[200px]">
            <!-- Stack boxes injected here -->
          </div>
        </div>

        <!-- HEAP -->
        <div class="w-1/2 flex flex-col gap-2">
          <h3 class="text-xs font-bold text-[var(--muted-foreground)] uppercase tracking-wider text-center">Heap (Objects)</h3>
          <div id="heap-boxes" class="bg-[var(--background)] border border-[var(--border)] rounded-md p-3 flex flex-col gap-3 min-h-[200px]">
            <!-- Heap boxes injected here -->
          </div>
        </div>

      </div>

    </div>

    <!-- Explanation Panel -->
    <div class="bg-blue-500/10 border-l-4 border-blue-500 p-3 rounded-r-md mt-2">
      <p class="text-sm" id="explanation-display">Loading execution steps...</p>
    </div>

  </div>

<script>
/** -------------------------------------------------------------
 * OMNICODE TUTOR CONTRACT AREA
 * ------------------------------------------------------------- */
const execution_data = {
  code: "list_a = [1, 2, 3]\nlist_b = list_a\nlist_b.append(4)",
  steps: [
    {
      line: 1,
      explanation: "Python creates the list in the HEAP. The variable 'list_a' in the STACK merely stores a POINTER to that memory address.",
      stack: [ { id: "var_a", name: "list_a", address: "0x100", value: "0x800", points_to: "heap_list" } ],
      heap: [ { id: "heap_list", address: "0x800", value: "[1, 2, 3]" } ]
    },
    {
      line: 2,
      explanation: "You are copying the POINTER, not the list. Now 'list_b' points to the EXACT SAME physical memory address (0x800).",
      stack: [ 
        { id: "var_a", name: "list_a", address: "0x100", value: "0x800", points_to: "heap_list" },
        { id: "var_b", name: "list_b", address: "0x104", value: "0x800", points_to: "heap_list", changed: true } 
      ],
      heap: [ { id: "heap_list", address: "0x800", value: "[1, 2, 3]" } ]
    },
    {
      line: 3,
      explanation: "You mutated the object at 0x800. Since BOTH variables point there, modifying list_b also affects list_a!",
      stack: [ 
        { id: "var_a", name: "list_a", address: "0x100", value: "0x800", points_to: "heap_list" },
        { id: "var_b", name: "list_b", address: "0x104", value: "0x800", points_to: "heap_list" } 
      ],
      heap: [ { id: "heap_list", address: "0x800", value: "[1, 2, 3, 4]", changed: true } ]
    }
  ]
};
/** ------------------------------------------------------------- */

let currentStepIndex = 0;

function renderCode(activeLine) {
  const codeLines = execution_data.code.split('\\n');
  const codeHtml = codeLines.map(function(line, index) {
    const lineNum = index + 1;
    const isActive = lineNum === activeLine;
    const bgClass = isActive ? 'bg-blue-500/20 text-blue-700 dark:text-blue-400 border-l-2 border-blue-500 font-bold' : 'text-[var(--foreground)] border-l-2 border-transparent';
    const arrow = isActive ? '<span class="float-right animate-pulse">⬅️</span>' : '';
    
    return '<div class="px-2 py-0.5 flex justify-between ' + bgClass + '">' +
             '<span><span class="text-[var(--muted-foreground)] mr-2 select-none">' + lineNum + '</span>' + line + '</span>' +
             arrow +
           '</div>';
  }).join('');
  document.getElementById('code-block').innerHTML = codeHtml;
}

function drawBox(boxData) {
  const borderClass = boxData.changed ? 'border-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.5)] scale-[1.02]' : 'border-[var(--border)]';
  return '<div id="' + boxData.id + '" class="bg-[var(--card)] border ' + borderClass + ' rounded flex justify-between items-center p-2 text-xs transition-all duration-300">' +
           '<div class="flex flex-col">' +
             '<span class="font-mono text-blue-600 dark:text-blue-400 font-bold">' + (boxData.name || 'Memory') + '</span>' +
             '<span class="text-[8px] text-[var(--muted-foreground)] uppercase">' + boxData.address + '</span>' +
           '</div>' +
           '<span class="font-mono bg-[var(--background)] px-2 py-1 rounded">' + boxData.value + '</span>' +
         '</div>';
}

function renderStep(index) {
  const step = execution_data.steps[index];
  
  // 1. Render Code & Explanation
  renderCode(step.line);
  document.getElementById('explanation-display').innerText = step.explanation;

  // 2. Render Memory Boxes
  const stackHtml = step.stack.map(drawBox).join('');
  const heapHtml = step.heap.map(drawBox).join('');

  document.getElementById('stack-boxes').innerHTML = stackHtml || '<div class="text-center text-[var(--muted-foreground)] text-xs italic mt-4">(Empty)</div>';
  document.getElementById('heap-boxes').innerHTML = heapHtml || '<div class="text-center text-[var(--muted-foreground)] text-xs italic mt-4">(Empty)</div>';

  drawPointers(step);
  updateButtons();
}

function drawPointers(step) {
  const svg = document.getElementById('arrow-svg');
  svg.innerHTML = ''; 

  const defs = '<defs><marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/></marker></defs>';
  svg.innerHTML += defs;

  setTimeout(function() {
    step.stack.forEach(function(variable) {
      if (variable.points_to) {
        const sourceBox = document.getElementById(variable.id);
        const targetBox = document.getElementById(variable.points_to);
        
        if (sourceBox && targetBox) {
          const containerRect = document.getElementById('memory-container').getBoundingClientRect();
          const sRect = sourceBox.getBoundingClientRect();
          const tRect = targetBox.getBoundingClientRect();

          const startX = sRect.right - containerRect.left;
          const startY = sRect.top + (sRect.height / 2) - containerRect.top;
          const endX = tRect.left - containerRect.left - 5; 
          const endY = tRect.top + (tRect.height / 2) - containerRect.top;

          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          const d = "M " + startX + " " + startY + " C " + (startX + 30) + " " + startY + ", " + (endX - 30) + " " + endY + ", " + endX + " " + endY;
          
          path.setAttribute("d", d);
          path.setAttribute("stroke", "#3b82f6");
          path.setAttribute("stroke-width", "2");
          path.setAttribute("fill", "transparent");
          path.setAttribute("marker-end", "url(#arrowhead)");
          svg.appendChild(path);
        }
      }
    });
  }, 50);
}

function updateButtons() {
  document.getElementById('btn-prev').disabled = currentStepIndex === 0;
  document.getElementById('btn-next').disabled = currentStepIndex === execution_data.steps.length - 1;
}

document.getElementById('btn-next').addEventListener('click', function() {
  if (currentStepIndex < execution_data.steps.length - 1) {
    currentStepIndex++;
    renderStep(currentStepIndex);
  }
});

document.getElementById('btn-prev').addEventListener('click', function() {
  if (currentStepIndex > 0) {
    currentStepIndex--;
    renderStep(currentStepIndex);
  }
});

window.onload = function() {
  if (execution_data && execution_data.steps.length > 0) {
    renderStep(0);
  }
};
</script>
</body>
</html>
