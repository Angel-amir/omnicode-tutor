<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .dim-path { stroke: #334155; stroke-width: 3; transition: all 0.5s; }
    .glow-path-cyan { stroke: #06b6d4; stroke-width: 5; filter: drop-shadow(0 0 5px #06b6d4); transition: all 0.5s; }
    .glow-path-rose { stroke: #f43f5e; stroke-width: 5; filter: drop-shadow(0 0 5px #f43f5e); transition: all 0.5s; }
    .node-dim { opacity: 0.3; filter: grayscale(100%); }
    .node-active { opacity: 1; transform: scale(1.05); box-shadow: 0 0 15px rgba(255, 255, 255, 0.15); border-color: #94a3b8 !important; }
    #execution-ball { transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .dock { width: 3rem; height: 3rem; border-radius: 9999px; border: 2px dashed rgba(255,255,255,0.3); background: rgba(0,0,0,0.3); box-sizing: border-box; }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-2">
  <div class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-xl p-4 shadow-sm flex flex-col gap-4 relative">
    
    <div class="flex justify-between items-end">
      <div>
        <h2 class="font-semibold text-lg flex items-center gap-2">🧩 The Puzzle Flow V5 (Fixed Math)</h2>
        <p class="text-[var(--muted-foreground)] text-sm">Pixel-perfect docking using precise border-box offsets.</p>
      </div>
      <div class="flex gap-2">
        <button id="btn-prev" disabled class="px-3 py-1 bg-[var(--background)] border border-[var(--border)] rounded-md text-sm transition-colors">Prev</button>
        <button id="btn-next" class="px-3 py-1 bg-cyan-500 text-white rounded-md text-sm hover:bg-cyan-600 transition-colors">Next</button>
      </div>
    </div>

    <div class="flex flex-row gap-4 h-[450px]">
      
      <!-- Code Panel -->
      <div class="w-1/3 flex flex-col gap-2">
        <h3 class="text-xs font-bold text-[var(--muted-foreground)] uppercase tracking-wider">Python Code</h3>
        <div id="code-block" class="bg-[var(--background)] rounded-md border border-[var(--border)] py-2 font-mono text-xs overflow-x-auto flex-grow">
          <div class="px-2 py-1 transition-colors border-l-4 border-transparent" id="code-1">1  age = 15</div>
          <div class="px-2 py-1 transition-colors border-l-4 border-transparent" id="code-2">2  if age >= 18:</div>
          <div class="px-2 py-1 transition-colors border-l-4 border-transparent pl-6" id="code-3">3    print('Adult')</div>
          <div class="px-2 py-1 transition-colors border-l-4 border-transparent" id="code-4">4  else:</div>
          <div class="px-2 py-1 transition-colors border-l-4 border-transparent pl-6" id="code-5">5    print('Minor')</div>
          <div class="px-2 py-1 transition-colors border-l-4 border-transparent" id="code-6">6  print('Done')</div>
        </div>
      </div>

      <!-- Logic Map Panel -->
      <div class="w-2/3 relative bg-slate-900 rounded-lg overflow-hidden border-4 border-slate-800 shadow-inner" id="map-container">
        
        <!-- SVG Paths -->
        <svg class="absolute inset-0 w-full h-full pointer-events-none" id="flow-svg">
          <path id="path-1" d="M 250 10 L 250 50" class="dim-path" fill="none"/>
          <path id="path-2" d="M 250 110 L 250 150" class="dim-path" fill="none"/>
          <path id="path-3-true" d="M 250 230 L 120 280" class="dim-path" fill="none"/>
          <path id="path-3-false" d="M 250 230 L 380 280" class="dim-path" fill="none"/>
          <path id="path-4-true" d="M 120 340 L 250 400" class="dim-path" fill="none"/>
          <path id="path-4-false" d="M 380 340 L 250 400" class="dim-path" fill="none"/>
        </svg>

        <!-- Nodes Layer -->
        <div class="absolute inset-0 z-20">
          
          <!-- Start Track Point -->
          <div id="slot-start" class="absolute top-[5px] left-[250px] w-12 h-12 -translate-x-1/2 opacity-0"></div>

          <!-- Assignment Node -->
          <div id="node-assign" class="absolute top-[50px] left-[175px] w-[150px] h-[60px] bg-slate-800 border-2 border-slate-600 rounded-lg flex items-center justify-center transition-all duration-300 gap-2">
            <span class="font-mono font-bold text-slate-300 text-sm">age =</span>
            <!-- DOCK 1 -->
            <div id="slot-pickup" class="dock border-cyan-500/50"></div>
          </div>
          
          <!-- Condition Node -->
          <div id="node-cond" class="absolute top-[150px] left-[125px] w-[250px] h-[80px] bg-slate-800/80 border-2 border-slate-500 rounded-lg flex flex-col items-center justify-center transition-all duration-300">
            <span class="text-[9px] uppercase text-slate-400 font-bold mb-1 tracking-widest absolute top-1">Condition</span>
            <div class="flex items-center gap-2 mt-2">
              <span class="font-mono text-slate-400 text-sm">if</span>
              <!-- DOCK 2 -->
              <div id="slot-hole" class="dock border-yellow-500/50"></div>
              <span class="font-mono font-bold text-yellow-300 text-lg">>= 18:</span>
            </div>
          </div>

          <!-- True Branch -->
          <div id="node-true" class="absolute top-[280px] left-[45px] w-[150px] h-[60px] bg-slate-800 border-2 border-emerald-500 rounded-md flex flex-col items-center justify-center transition-all duration-300">
            <span class="font-mono font-bold text-emerald-400 text-sm">print('Adult')</span>
          </div>

          <!-- False Branch -->
          <div id="node-false" class="absolute top-[280px] left-[305px] w-[150px] h-[60px] bg-slate-800 border-2 border-rose-500 rounded-md flex flex-col items-center justify-center transition-all duration-300">
            <span class="font-mono font-bold text-rose-400 text-sm">print('Minor')</span>
          </div>

          <!-- End Node -->
          <div id="node-end" class="absolute top-[400px] left-[180px] w-[140px] h-[40px] bg-slate-800 border-2 border-slate-600 rounded-full flex flex-col items-center justify-center transition-all duration-300">
             <span class="font-mono font-bold text-slate-400 text-xs">print('Done')</span>
          </div>
        </div>

        <!-- The Execution Ball -->
        <div id="execution-ball" class="absolute w-12 h-12 bg-slate-400 border-[3px] border-white rounded-full z-30 flex items-center justify-center text-slate-900 font-black font-mono text-sm m-0 p-0 box-border" style="top: -100px; left: -100px;">
          <span id="ball-val"></span>
        </div>

      </div>
    </div>

    <!-- Explanation -->
    <div class="bg-cyan-500/10 border-l-4 border-cyan-500 p-3 rounded-r-md mt-2">
      <p class="text-sm" id="explanation-display">Loading...</p>
    </div>

  </div>

<script>
const steps = [
  { 
    code: 1, exp: "Line 1: Execution begins. The value '15' is assigned to 'age'.", 
    targetSlot: "slot-pickup", ballTxt: "15", ballColor: "bg-cyan-400", shadow: "#22d3ee", ballVisible: true,
    nodeOn: "node-assign", pathOn: ["path-1"], pathColor: "glow-path-cyan"
  },
  { 
    code: 2, exp: "Line 2: The execution thread evaluates the condition. It substitutes the value '15' into the variable slot.", 
    targetSlot: "slot-hole", ballTxt: "15", ballColor: "bg-cyan-400", shadow: "#22d3ee", ballVisible: true,
    nodeOn: "node-cond", pathOn: ["path-1", "path-2"], pathColor: "glow-path-cyan"
  },
  { 
    code: 2, exp: "The equation is [15] >= 18. Python evaluates it... FALSE! The value transforms into a Boolean result.", 
    targetSlot: "slot-hole", ballTxt: "False", ballColor: "bg-rose-500 text-white", shadow: "#f43f5e", textScale: "text-[10px]", ballVisible: true,
    nodeOn: "node-cond", pathOn: ["path-1", "path-2"], pathColor: "glow-path-cyan"
  },
  { 
    code: 5, exp: "Because it evaluated to False, the boolean ball dissolves, and the execution energy is routed down the False track to the Else block.", 
    targetSlot: "slot-hole", ballTxt: "False", ballColor: "bg-rose-500", shadow: "transparent", ballVisible: false,
    nodeOn: "node-false", dimNode: "node-true", pathOn: ["path-1", "path-2", "path-3-false"], pathColor: "glow-path-rose"
  },
  { 
    code: 6, exp: "The if/else statement finishes. The execution merges back and runs the final print.", 
    targetSlot: "slot-hole", ballTxt: "", ballColor: "bg-slate-400", shadow: "transparent", ballVisible: false,
    nodeOn: "node-end", dimNode: "node-true", pathOn: ["path-1", "path-2", "path-3-false", "path-4-false"], pathColor: "glow-path-rose"
  }
];

let i = 0;

function moveToSlot(slotId) {
  const container = document.getElementById('map-container');
  const containerRect = container.getBoundingClientRect();
  const slotRect = document.getElementById(slotId).getBoundingClientRect();
  
  // THE MATH FIX: Subtract the container's border widths (clientTop/clientLeft)
  // because absolute positioning starts INSIDE the border, whereas getBoundingClientRect includes it.
  const y = (slotRect.top - containerRect.top) - container.clientTop;
  const x = (slotRect.left - containerRect.left) - container.clientLeft;
  
  const ball = document.getElementById('execution-ball');
  ball.style.top = y + 'px';
  ball.style.left = x + 'px';
}

function update() {
  const step = steps[i];
  document.getElementById('explanation-display').innerText = step.exp;
  
  [1,2,3,4,5,6].forEach(n => {
    const el = document.getElementById(`code-${n}`);
    el.classList.remove('bg-cyan-500/20', 'border-cyan-500', 'font-bold');
    el.classList.add('border-transparent');
    if (el.innerHTML.includes('⬅️')) el.innerHTML = el.innerHTML.replace('<span class="float-right animate-pulse text-cyan-500">⬅️</span>', '');
    el.classList.remove('opacity-30', 'line-through');
    
    if (step.dimNode && n === 3) el.classList.add('opacity-30', 'line-through');
  });
  const act = document.getElementById(`code-${step.code}`);
  act.classList.add('bg-cyan-500/20', 'border-cyan-500', 'font-bold');
  act.classList.remove('border-transparent');
  act.innerHTML += '<span class="float-right animate-pulse text-cyan-500">⬅️</span>';

  // Ball Movement
  moveToSlot(step.targetSlot);
  
  // Ball styling
  const ball = document.getElementById('execution-ball');
  const visibilityClass = step.ballVisible ? 'scale-100 opacity-100' : 'scale-0 opacity-0';
  ball.className = `absolute w-12 h-12 border-[3px] border-white rounded-full z-30 flex items-center justify-center font-black font-mono box-border transition-all duration-700 ${step.ballColor} ${step.textScale || 'text-sm'} ${visibilityClass}`;
  
  if (step.ballVisible) {
    ball.style.boxShadow = `0 0 15px ${step.shadow}`;
  } else {
    ball.style.boxShadow = 'none';
  }
  document.getElementById('ball-val').innerText = step.ballTxt;

  // Nodes
  ['node-assign', 'node-cond', 'node-true', 'node-false', 'node-end'].forEach(id => {
    document.getElementById(id).classList.remove('node-active', 'node-dim');
  });
  if(step.nodeOn) document.getElementById(step.nodeOn).classList.add('node-active');
  if(step.dimNode) document.getElementById(step.dimNode).classList.add('node-dim');

  // Paths
  ['path-1', 'path-2', 'path-3-true', 'path-3-false', 'path-4-true', 'path-4-false'].forEach(id => {
    const path = document.getElementById(id);
    path.classList.remove('glow-path-cyan', 'glow-path-rose');
    path.classList.add('dim-path');
  });
  
  if (step.pathOn) {
    step.pathOn.forEach(id => {
      document.getElementById(id).classList.remove('dim-path');
      document.getElementById(id).classList.add(step.pathColor);
    });
  }

  document.getElementById('btn-prev').disabled = i === 0;
  document.getElementById('btn-next').disabled = i === steps.length - 1;
}

document.getElementById('btn-next').onclick = () => { if(i<steps.length-1) { i++; update(); } };
document.getElementById('btn-prev').onclick = () => { if(i>0) { i--; update(); } };

window.addEventListener('resize', () => moveToSlot(steps[i].targetSlot));
window.onload = () => {
  // Move ball to start immediately, then animate to step 0
  moveToSlot('slot-start');
  setTimeout(update, 50); 
};
</script>
</body>
</html>
