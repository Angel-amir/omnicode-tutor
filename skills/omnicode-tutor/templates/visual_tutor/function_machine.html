<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .machine-pop { transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .blueprint-pulse { animation: pulse-border 2s infinite; }
    @keyframes pulse-border {
      0% { border-color: rgba(56, 189, 248, 0.3); }
      50% { border-color: rgba(56, 189, 248, 0.8); box-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
      100% { border-color: rgba(56, 189, 248, 0.3); }
    }
    .value-ball { transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1); }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-2">
  <div class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-xl p-4 shadow-sm flex flex-col gap-4 relative">
    
    <div class="flex justify-between items-end">
      <div>
        <h2 class="font-semibold text-lg flex items-center gap-2">🏭 The Function Machine V3</h2>
        <p class="text-[var(--muted-foreground)] text-sm">Visual bugfix: Precise ball flow and timing.</p>
      </div>
      <div class="flex gap-2">
        <button id="btn-prev" disabled class="px-3 py-1 bg-[var(--background)] border border-[var(--border)] rounded-md text-sm transition-colors">Prev</button>
        <button id="btn-next" class="px-3 py-1 bg-cyan-500 text-white rounded-md text-sm hover:bg-cyan-600 transition-colors">Next</button>
      </div>
    </div>

    <div class="flex flex-row gap-4 h-[450px]">
      
      <!-- Code Panel -->
      <div class="w-1/3 flex flex-col gap-2">
        <h3 class="text-xs font-bold text-[var(--muted-foreground)] uppercase tracking-wider">Python Code</h3>
        <div id="code-block" class="bg-[var(--background)] rounded-md border border-[var(--border)] py-2 font-mono text-xs overflow-x-auto flex-grow">
          <div class="px-2 py-1 transition-colors border-l-4 border-transparent" id="code-1">1  def double(n):</div>
          <div class="px-2 py-1 transition-colors border-l-4 border-transparent pl-6" id="code-2">2    res = n * 2</div>
          <div class="px-2 py-1 transition-colors border-l-4 border-transparent pl-6" id="code-3">3    return res</div>
          <div class="px-2 py-1 transition-colors border-l-4 border-transparent" id="code-4">4  </div>
          <div class="px-2 py-1 transition-colors border-l-4 border-transparent" id="code-5">5  ans = double(5)</div>
        </div>
      </div>

      <!-- Logic Map Panel -->
      <div class="w-2/3 relative bg-slate-900 rounded-lg overflow-hidden border-4 border-slate-800 shadow-inner flex flex-col p-4" id="map-container">
        
        <!-- Global Scope Header -->
        <div class="absolute top-2 left-4">
          <span class="text-[10px] uppercase font-bold text-slate-500 tracking-widest">Global Universe</span>
        </div>

        <!-- Hidden starting dock for the ball -->
        <div id="dock-start" class="absolute top-[160px] left-[80px] w-8 h-8 opacity-0"></div>

        <!-- Global Storage Area -->
        <div class="flex justify-between w-full z-10 mt-6 px-4">
          
          <!-- Blueprints (Functions) -->
          <div id="blueprint-area" class="w-[160px] h-[70px] border-2 border-slate-700 border-dashed rounded-lg flex flex-col items-center justify-center bg-slate-800/30 transition-all duration-500">
            <span class="text-[9px] uppercase text-slate-400 font-bold mb-1">Saved Blueprints</span>
            <div id="blueprint-doc" class="scale-0 opacity-0 transition-all duration-500 bg-sky-900/50 border border-sky-400 rounded px-3 py-1 flex items-center gap-2">
              <span class="text-lg">📜</span>
              <span class="font-mono text-sky-200 text-xs">double(n)</span>
            </div>
          </div>

          <!-- Global Variables -->
          <div id="global-vars-area" class="w-[160px] h-[70px] border-2 border-slate-700 rounded-lg flex flex-col items-center justify-center bg-slate-800/50 transition-all duration-500 relative">
            <span class="text-[9px] uppercase text-slate-400 font-bold mb-1">Global Variables</span>
            <div id="global-ans" class="opacity-0 transition-all duration-500 flex items-center gap-2">
               <span class="font-mono font-bold text-slate-300">ans =</span>
               <div id="dock-ans" class="w-8 h-8 rounded-full border-2 border-dashed border-slate-500 flex items-center justify-center text-sm"></div>
            </div>
          </div>
        </div>

        <!-- THE MACHINE (Local Scope) -->
        <div class="flex-grow flex items-center justify-center relative mt-6">
          
          <div id="the-machine" class="w-[300px] bg-slate-700 border-4 border-slate-600 rounded-xl flex flex-col items-center relative shadow-[0_10px_30px_rgba(0,0,0,0.5)] machine-pop scale-0 opacity-0 transform origin-bottom">
            
            <!-- Machine Header -->
            <div class="w-full bg-slate-800 flex justify-end items-center px-4 py-1.5 border-b-2 border-slate-600 rounded-t-lg">
              <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                <span>⚙️ Machine:</span> <span class="text-sky-300 font-mono">double()</span>
              </span>
            </div>

            <!-- Funnels (Inputs) -->
            <div class="absolute -top-9 left-6 flex gap-4">
               <div class="flex flex-col items-center">
                 <div id="dock-n-entry" class="w-8 h-8 rounded-full border-2 border-dashed border-sky-500/50 mb-1 flex items-center justify-center"></div>
                 <div class="w-12 h-6 bg-slate-600 rounded-t-lg border-x-2 border-t-2 border-slate-500 flex items-end justify-center pb-1">
                   <span class="text-[10px] font-mono text-slate-300 font-bold">n</span>
                 </div>
               </div>
            </div>

            <!-- Glass Belly (Local Scope) -->
            <div class="w-[90%] my-4 h-[120px] bg-indigo-950/60 border-2 border-indigo-500/50 rounded-lg relative overflow-hidden shadow-inner flex flex-col items-center justify-center">
              <span class="absolute top-1 left-2 text-[8px] uppercase text-indigo-400 font-bold tracking-widest opacity-60">Local Scope (Sealed)</span>
              
              <!-- Local Variables -->
              <div class="flex flex-col gap-3 w-full px-8 mt-4">
                <div class="flex justify-between items-center w-full opacity-0 transition-opacity duration-500" id="local-var-n">
                  <span class="font-mono text-sm text-sky-200">n</span>
                  <span class="font-mono text-sm text-slate-400">=</span>
                  <div class="w-8 h-8 bg-sky-500 rounded-full flex items-center justify-center text-white font-bold text-sm shadow-md" id="val-n">5</div>
                </div>
                
                <div class="flex justify-between items-center w-full opacity-0 transition-opacity duration-500" id="local-var-res">
                  <span class="font-mono text-sm text-emerald-300">res</span>
                  <span class="font-mono text-sm text-slate-400">=</span>
                  <div class="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center text-white font-bold text-sm shadow-md" id="val-res">10</div>
                </div>
              </div>
            </div>

            <!-- Output Tube -->
            <div class="absolute -bottom-8 flex flex-col items-center">
              <div class="w-12 h-8 bg-slate-600 rounded-b-lg border-x-2 border-b-2 border-slate-500 flex justify-center">
                <span class="text-[8px] uppercase font-bold text-slate-400 mt-1">OUT</span>
              </div>
              <div id="dock-return" class="w-8 h-8 rounded-full mt-1 border-2 border-dashed border-emerald-500/50 flex items-center justify-center"></div>
            </div>

          </div>
        </div>

        <!-- The Traveling Ball (Value passing) -->
        <div id="travel-ball" class="value-ball absolute w-8 h-8 border-2 border-white rounded-full z-40 flex items-center justify-center text-white font-black font-mono text-xs scale-0 opacity-0" style="top: -100px; left: -100px;">
          <span id="travel-val">5</span>
        </div>

      </div>
    </div>

    <!-- Explanation -->
    <div class="bg-sky-500/10 border-l-4 border-sky-500 p-3 rounded-r-md mt-2">
      <p class="text-sm" id="explanation-display">Loading...</p>
    </div>

  </div>

<script>
const steps = [
  {
    code: 1, exp: "Paso 1: Python lee la definición 'def double(n):'. Solo se guarda el 'Plano' (Blueprint) en memoria global.",
    blueprint: 1, machine: 0, ans: 0,
    ball: { s: 0, dock: "dock-start", t: "5" } // Hidden initially
  },
  {
    code: 5, exp: "Paso 2: ¡Invocación! Python lee 'double(5)'. Se extrae el valor '5' y se construye la MÁQUINA temporal.",
    blueprint: 1, machine: 1, ans: 1,
    ball: { s: 1, dock: "dock-start", t: "5", bg: "bg-sky-500" } // Ball spawns in global space while machine is building
  },
  {
    code: 1, exp: "Paso 3 (Argumentos): El valor '5' vuela y cae por el embudo de la máquina.",
    blueprint: 1, machine: 1, ans: 1, locN: 0, locRes: 0,
    ball: { s: 1, dock: "dock-n-entry", t: "5", bg: "bg-sky-500" } // Ball flies to the funnel
  },
  {
    code: 1, exp: "Paso 4 (Scope Local): El valor ingresa al interior sellado (Local Scope) bajo el alias 'n'.",
    blueprint: 1, machine: 1, ans: 1, locN: 1, locRes: 0,
    ball: { s: 0, dock: "dock-n-entry", t: "5", bg: "bg-sky-500" } // Ball vanishes, local variable appears inside
  },
  {
    code: 2, exp: "Paso 5 (Scope Local): Se ejecuta 'res = n * 2'. ¡Esta nueva variable también queda atrapada en la burbuja!",
    blueprint: 1, machine: 1, ans: 1, locN: 1, locRes: 1,
    ball: { s: 0, dock: "dock-return", t: "10", bg: "bg-emerald-500" } // Setup ball for return silently
  },
  {
    code: 3, exp: "Paso 6 (Return): La instrucción 'return' escupe el valor de 'res' (10) hacia afuera por el tubo de escape.",
    blueprint: 1, machine: 1, ans: 1, locN: 1, locRes: 1,
    ball: { s: 1, dock: "dock-return", t: "10", bg: "bg-emerald-500" } // Ball spawns at return tube
  },
  {
    code: 5, exp: "Paso 7 (Destrucción): ¡La máquina se desintegra! Las variables locales mueren. El '10' viaja y es capturado por 'ans'.",
    blueprint: 1, machine: 0, ans: 1, locN: 0, locRes: 0, ansFilled: 1, 
    ball: { s: 1, dock: "dock-ans", t: "10", bg: "bg-emerald-500" } // Ball flies to ans
  }
];

let currentStep = 0;

function placeBall(dockId) {
  const container = document.getElementById('map-container');
  const dockEl = document.getElementById(dockId);
  if(!dockEl) return;
  const cr = container.getBoundingClientRect();
  const dr = dockEl.getBoundingClientRect();
  const ball = document.getElementById('travel-ball');
  ball.style.top = (dr.top - cr.top - container.clientTop) + 'px';
  ball.style.left = (dr.left - cr.left - container.clientLeft) + 'px';
}

function update() {
  const step = steps[currentStep];
  document.getElementById('explanation-display').innerText = step.exp;
  
  [1,2,3,4,5].forEach(n => {
    const el = document.getElementById(`code-${n}`);
    el.classList.remove('bg-cyan-500/20', 'border-cyan-500', 'font-bold');
    if (el.innerHTML.includes('⬅️')) el.innerHTML = el.innerHTML.replace('<span class="float-right animate-pulse text-cyan-500">⬅️</span>', '');
  });
  if(step.code) {
    const act = document.getElementById(`code-${step.code}`);
    act.classList.add('bg-cyan-500/20', 'border-cyan-500', 'font-bold');
    act.innerHTML += '<span class="float-right animate-pulse text-cyan-500">⬅️</span>';
  }

  const bpDoc = document.getElementById('blueprint-doc');
  step.blueprint ? bpDoc.classList.replace('scale-0', 'scale-100') : bpDoc.classList.replace('scale-100', 'scale-0');
  step.blueprint ? bpDoc.classList.replace('opacity-0', 'opacity-100') : bpDoc.classList.replace('opacity-100', 'opacity-0');
  step.blueprint ? document.getElementById('blueprint-area').classList.add('blueprint-pulse') : document.getElementById('blueprint-area').classList.remove('blueprint-pulse');

  const gAns = document.getElementById('global-ans');
  step.ans ? gAns.classList.replace('opacity-0', 'opacity-100') : gAns.classList.replace('opacity-100', 'opacity-0');

  const mach = document.getElementById('the-machine');
  step.machine ? mach.classList.replace('scale-0', 'scale-100') : mach.classList.replace('scale-100', 'scale-0');
  step.machine ? mach.classList.replace('opacity-0', 'opacity-100') : mach.classList.replace('opacity-100', 'opacity-0');

  const lN = document.getElementById('local-var-n');
  step.locN ? lN.classList.replace('opacity-0', 'opacity-100') : lN.classList.replace('opacity-100', 'opacity-0');

  const lRes = document.getElementById('local-var-res');
  step.locRes ? lRes.classList.replace('opacity-0', 'opacity-100') : lRes.classList.replace('opacity-100', 'opacity-0');

  if (step.ansFilled) {
    document.getElementById('dock-ans').classList.add('bg-emerald-500', 'border-emerald-500', 'text-white', 'font-bold');
    document.getElementById('dock-ans').innerText = '10';
    document.getElementById('travel-ball').classList.replace('scale-100', 'scale-0');
  } else {
    document.getElementById('dock-ans').classList.remove('bg-emerald-500', 'border-emerald-500', 'text-white', 'font-bold');
    document.getElementById('dock-ans').innerText = '';
  }

  const ball = document.getElementById('travel-ball');
  if (step.ball.s && !step.ansFilled) {
    placeBall(step.ball.dock);
    document.getElementById('travel-val').innerText = step.ball.t;
    ball.className = `value-ball absolute w-8 h-8 border-2 border-white rounded-full z-40 flex items-center justify-center text-white font-black font-mono text-xs scale-100 opacity-100 ${step.ball.bg}`;
  } else {
    ball.classList.replace('scale-100', 'scale-0');
    ball.classList.replace('opacity-100', 'opacity-0');
  }

  document.getElementById('btn-prev').disabled = currentStep === 0;
  document.getElementById('btn-next').disabled = currentStep === steps.length - 1;
}

document.getElementById('btn-next').onclick = () => { if(currentStep<steps.length-1) { currentStep++; update(); } };
document.getElementById('btn-prev').onclick = () => { if(currentStep>0) { currentStep--; update(); } };
window.addEventListener('resize', () => { if(steps[currentStep].ball.s) placeBall(steps[currentStep].ball.dock); });

window.onload = () => { setTimeout(update, 100); };
</script>
</body>
</html>
